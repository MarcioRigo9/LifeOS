# Production stack (ARCHITECTURE.md §11). Run with:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# See DEPLOY.md for the full first-time VPS provisioning sequence.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifeos_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: lifeos
      # Consumed by db/init/02-set-runtime-password.sh on first initialization ONLY — never
      # hardcoded like the dev-only default in 01-roles.sql (SECURITY_MODEL.md §3.1).
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
    # No `ports:` mapping — unlike the dev compose file, production never exposes Postgres
    # outside the Docker-internal network (SECURITY_MODEL.md §14). Every other service reaches
    # it as `db:5432` over the compose-managed network.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos_admin -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: web-runner
    environment:
      DATABASE_URL_RUNTIME: postgres://lifeos_runtime:${POSTGRES_RUNTIME_PASSWORD}@db:5432/lifeos
      SESSION_SECRET: ${SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NODE_ENV: production
    # No DATABASE_URL_ADMIN here at all — the web container has no code path that ever uses it
    # (every apps/web/src/app/api/* route calls getRuntimePool(), never an admin pool), so it
    # doesn't get the credential in the first place, not just "doesn't use" it.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.worker
    environment:
      # The scheduler's cross-household job discovery is a deliberate, narrow, READ-ONLY
      # exception to "web/worker only ever connect as lifeos_runtime" (scheduler/worker.ts's
      # module doc, Fase 6) — every claim and mutation still goes through DATABASE_URL_RUNTIME.
      # This same image (not the running `worker` container) is also reused by deploy.sh for the
      # one-off `npm run migrate` / `npm run seed:catalog` admin tasks via `docker compose run`.
      DATABASE_URL_ADMIN: postgres://lifeos_admin:${POSTGRES_ADMIN_PASSWORD}@db:5432/lifeos
      DATABASE_URL_RUNTIME: postgres://lifeos_runtime:${POSTGRES_RUNTIME_PASSWORD}@db:5432/lifeos
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_URL: ${APP_URL}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
